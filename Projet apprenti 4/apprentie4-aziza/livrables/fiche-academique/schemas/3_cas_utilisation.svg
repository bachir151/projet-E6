th="1.5" stroke-dasharray="6 4"/><text x="420" y="572" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Proposer une modification</text><text x="420" y="589" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">(extension)</text><line x1="560" y1="185" x2="573" y2="185" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="567" y="172" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«include»</text><circle cx="110" cy="80" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="110,90 110,118" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="94,100 126,100" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="97,140 110,118 123,140" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="110" y="160" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Référent</text><circle cx="110" cy="330" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="110,340 110,368" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="94,350 126,350" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="97,390 110,368 123,390" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="110" y="410" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Technicien</text><circle cx="110" cy="520" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="110,530 110,558" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="94,540 126,540" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="97,580 110,558 123,580" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="110" y="600" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Horloge</text><text x="110" y="616" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">tâche planifiée</text><circle cx="980" c