<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="745" viewBox="0 0 1080 745" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="30" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Diagramme de séquence (sd) – mise à jour d’un PC puis sortie à la borne</text><circle cx="110" cy="52" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="110,62 110,90" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="94,72 126,72" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="97,112 110,90 123,112" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="110" y="132" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle"></text><text x="110" y="142" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Technicien</text><polyline points="110,152 110,700" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="295" y="60" width="150" height="40" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="370" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Agent PC</text><polyline points="370,100 370,700" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="575" y="60" width="150" height="40" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.4"/><text x="650" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Serveur</text><polyline points="650,100 650,700" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="855" y="60" width="150" height="40" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="930" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Borne</text><polyline points="930,100 930,700" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><text x="125" y="166" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">Toutes les 30 min, au démarrage ou à l’ouverture de session :</text><line x1="370" y1="190" x2="644" y2="190" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="507.0" y="184" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">1. GET /kit/catalogue (HTTPS)</text><line x1="650" y1="225" x2="376" y2="225" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="513.0" y="219" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">2. catalogue.json + catalogue.cat signé</text><polyline points="370,245 410,245 410,267 376,267" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="390" y1="267" x2="374" y2="267" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="418" y="253" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">3. vérifie la signature, une version plus</text><text x="418" y="269" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">grande, compare les empreintes</text><line x1="370" y1="310" x2="644" y2="310" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="507.0" y="304" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">4. GET fichiers modifiés seulement (BITS)</text><line x1="650" y1="345" x2="376" y2="345" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="513.0" y="339" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">5. fichiers (reprise si coupure)</text><polyline points="370,365 410,365 410,387 376,387" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="390" y1="387" x2="374" y2="387" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="418" y="373" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">6. Test-FileCatalog, puis bascule</text><text x="418" y="389" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">actif → précédent, préparation → actif</text><line x1="370" y1="430" x2="644" y2="430" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="507.0" y="424" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">7. POST rapport + jeton du PC</text><text x="125" y="472" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">Avant une intervention, au bureau :</text><line x1="110" y1="495" x2="924" y2="495" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="510.0" y="489" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">8. présente son badge puis l’étiquette du PC</text><line x1="930" y1="535" x2="656" y2="535" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="793.0" y="529" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">9. GET /pc/{id}/etat</text><line x1="650" y1="570" x2="924" y2="570" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="787.0" y="564" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">10. à jour ?, version, date du rapport</text><line x1="930" y1="610" x2="116" y2="610" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="510.0" y="604" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">11. voyant vert + bip (rouge si rapport ancien)</text><line x1="930" y1="650" x2="656" y2="650" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="793.0" y="644" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">12. POST /sorties + jeton de la borne</text><text x="30" y="730" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">Serveur muet : la borne clignote « vérification impossible » et garde la sortie en mémoire ; jamais « à jour ».</text></svg>