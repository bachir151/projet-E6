eight="normal" fill="#6b7280" text-anchor="end">Wi-Fi du bureau, HTTPS</text><rect x="30" y="450" width="290" height="120" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="175.0" y="472" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Banc de physique</text><text x="175.0" y="495" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">ESP32 + SHT40 + DS18B20</text><text x="175.0" y="512" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">temps d’attente avant d’allumer</text><text x="175.0" y="529" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">un PC qui sort du froid</text><text x="175" y="590" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">résultat → mode opératoire et étiquette du PC</text><rect x="800" y="270" width="290" height="100" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4"/><text x="945.0" y="292" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">SharePoint Online</text><text x="945.0" y="315" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">extension (Microsoft Graph)</text><text x="945.0" y="332" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">source réelle du kit</text><line x1="798" y1="320" x2="722" y2="320" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fl)"/><text x="760.0" y="310" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">en réel</text><rect x="800" y="450" width="290" height="120" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4"/><text x="945.0" y="472" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Boîtier de sacoche</text><text x="945.0" y="495" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">extension : ESP32-S3, écran e-ink</text><text x="945.0" y="512" font-size="13" font-weight="normal" 