<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="575" viewBox="0 0 1125 575" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="30" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Diagramme d’exigences (req) – chaque exigence est vérifiée par un test de recette</text><rect x="330" y="48" width="460" height="92" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/><text x="560.0" y="65" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="560.0" y="85" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">E0 – Kit de maintenance et archive</text><text x="560.0" y="108" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Tenir à jour les PC de maintenance nomades et garder</text><text x="560.0" y="126" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">l’historique des documents de modification</text><circle cx="560.0" cy="154" r="8" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><polyline points="552.0,154 568.0,154" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="560.0,146 560.0,162" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="560.0,162 560.0,180" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="157.5,180 967.5,180" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="25,180 25,370 1100,370 1100,180" fill="none" stroke="#fff" stroke-width="1.5"/><rect x="30" y="205" width="255" height="140" fill="#fff" strok