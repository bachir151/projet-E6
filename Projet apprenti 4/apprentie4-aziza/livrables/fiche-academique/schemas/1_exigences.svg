dth="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="697.5" y="411" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="697.5" y="428" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E7 – Archive (V2)</text><polyline points="570,437 825,437" fill="none" stroke="#4b5563" stroke-width="1"/><text x="578" y="455" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Retrouver une version par</text><text x="578" y="472" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">équipement, date ou</text><text x="578" y="489" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">auteur en moins d’1 min</text><text x="578" y="525" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : T11</text><polyline points="697.5,370 697.5,395" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="840" y="395" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="967.5" y="411" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="967.5" y="428" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E8 – Physique</text><polyline points="840,437 1095,437" fill="none" stroke="#4b5563" stroke-width="1"/><text x="848" y="455" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Donner le temps d’attente</text><text x="848" y="472" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">avant d’allumer un PC</text><text x="848" y="489" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">froid (modèle + mesures)</text><text x="848" y="525" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : mesures</text><polyline points="967.5,370 967.5,395" fill="none" stroke="#6b7280" stroke-width="1.