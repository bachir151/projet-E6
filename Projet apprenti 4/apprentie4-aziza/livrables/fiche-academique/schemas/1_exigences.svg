l="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="697.5" y="221" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="697.5" y="238" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E3 – Réseau mobile</text><polyline points="570,247 825,247" fill="none" stroke="#4b5563" stroke-width="1"/><text x="578" y="265" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Seuls les fichiers modifiés</text><text x="578" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">descendent ; reprise</text><text x="578" y="299" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">après une coupure</text><text x="578" y="335" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : T01, T04</text><polyline points="697.5,180 697.5,205" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="840" y="205" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="967.5" y="221" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="967.5" y="238" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E4 – Retour arrière</text><polyline points="840,247 1095,247" fill="none" stroke="#4b5563" stroke-width="1"/><text x="848" y="265" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Revenir à la version</text><text x="848" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">précédente en moins</text><text x="848" y="299" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">de 2 minutes</text><text x="848" y="335" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : T05</text><polyline points="967.5,180 967.5,205" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="30" y="395" width="255" hei