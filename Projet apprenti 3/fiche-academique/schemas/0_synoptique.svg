<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="34" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Synoptique de la maquette au lycée (réseau de laboratoire isolé, aucune donnée réelle)</text><rect x="30" y="60" width="300" height="160" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/><text x="180.0" y="82" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Boîtier de présence</text><text x="180.0" y="105" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">radar 24 GHz (LD2410)</text><text x="180.0" y="122" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">ESP32 + lumière tricolore</text><text x="180.0" y="139" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">chaque message signé (HMAC)</text><text x="180.0" y="156" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">sur le bureau, branché en USB</text><rect x="420" y="60" width="330" height="200" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="585.0" y="82" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Poste Windows 11 (VM)</text><text x="585.0" y="105" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">service de présence (SYSTÈME)</text><text x="585.0" y="122" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">verrou local dans la session agent</text><text x="585.0" y="139" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">agent PowerShell : états du poste</text><text x="585.0" y="156" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">redémarrage en attente, version</text><text x="585.0" y="173" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">maintenance à la prochaine absence (V2)</text><line x1="330" y1="140" x2="418" y2="140" stroke="#6b7280" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="374.0" y="132" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">USB série</text><rect x="840" y="60" width="290" height="150" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/><text x="985.0" y="82" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Serveur Ubuntu</text><text x="985.0" y="105" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">API Python (FastAPI), SQLite</text><text x="985.0" y="122" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">états et événements des postes</text><text x="985.0" y="139" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">tableau de bord du parc</text><text x="985.0" y="156" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">partage des paquets (SMB)</text><line x1="750" y1="130" x2="838" y2="130" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="794.0" y="122" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">HTTPS : états, événements</text><line x1="750" y1="190" x2="838" y2="190" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="794.0" y="182" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">SMB (paquets)</text><rect x="420" y="330" width="330" height="110" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="585.0" y="352" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Contrôleur de domaine commun</text><text x="585.0" y="375" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">AD DS, DNS, DHCP, NTP</text><text x="585.0" y="392" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">GPO : blocage après 10 min (filet)</text><text x="585.0" y="409" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">préparé par l’enseignant</text><line x1="585" y1="328" x2="585" y2="262" stroke="#6b7280" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="595" y="300" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Kerberos, LDAP, DNS, SMB</text><rect x="840" y="360" width="290" height="80" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="985.0" y="382" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Routeur Cisco ISR 4331</text><text x="985.0" y="405" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">passerelle, source NTP</text><line x1="838" y1="400" x2="752" y2="400" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="795.0" y="392" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">NTP</text><rect x="840" y="250" width="290" height="80" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="985.0" y="272" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">PC du technicien</text><text x="985.0" y="295" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">navigateur, Wireshark</text><line x1="985" y1="248" x2="985" y2="212" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="995" y="235" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">HTTPS</text><rect x="30" y="300" width="300" height="100" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4"/><text x="180.0" y="322" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Outil de déploiement réel</text><text x="180.0" y="345" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">en entreprise : il garde la liste</text><text x="180.0" y="362" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">des logiciels (extension)</text><line x1="330" y1="340" x2="418" y2="245" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fl)"/><text x="250" y="285" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">« quand » l’agent est absent</text><text x="30" y="480" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="start">En bleu : réalisé par l’apprenti (boîtier, serveur). Le verrouillage reste local (il marche sans serveur) ; le serveur ne reçoit ni heures ni durées d’absence.</text></svg>