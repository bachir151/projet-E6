<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="745" viewBox="0 0 1080 745" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="30" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Diagramme de séquence (sd) – l’agent part, l’écran se bloque localement, la maintenance en attente profite de l’absence</text><circle cx="110" cy="52" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="110,62 110,90" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="94,72 126,72" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="97,112 110,90 123,112" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="110" y="132" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle"></text><text x="110" y="142" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Agent</text><polyline points="110,152 110,700" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="280" y="60" width="160" height="40" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.4"/><text x="360" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Boîtier</text><polyline points="360,100 360,700" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="560" y="60" width="160" height="40" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="640" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Poste (service)</text><polyline points="640,100 640,700" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="850" y="60" width="160" height="40" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.4"/><text x="930" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Serveur</text><polyline points="930,100 930,700" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="360" y1="175" x2="634" y2="175" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="497.0" y="169" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">1. « présent » + preuve (chaque seconde)</text><polyline points="640,187 680,187 680,209 646,209" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="660" y1="209" x2="644" y2="209" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="688" y="195" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">2. vérifie la preuve et le compteur</text><text x="125" y="247" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">L’agent se lève et part</text><line x1="360" y1="270" x2="634" y2="270" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="497.0" y="264" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">3. « personne » + preuve</text><polyline points="640,282 680,282 680,304 646,304" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="660" y1="304" x2="644" y2="304" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="688" y="290" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">4. 5 s confirmées → événement 110</text><line x1="640" y1="335" x2="366" y2="335" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="503.0" y="329" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">5. lumière orange (3 s)</text><polyline points="640,347 680,347 680,369 646,369" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="660" y1="369" x2="644" y2="369" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="688" y="355" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">6. programme local dans la session :</text><text x="688" y="371" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">session verrouillée (événement 4800)</text><line x1="640" y1="410" x2="366" y2="410" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="503.0" y="404" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">7. lumière rouge</text><line x1="640" y1="430" x2="924" y2="430" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="782.0" y="424" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">7b. POST événement « verrou » (sans heure d’absence)</text><text x="125" y="450" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">20 minutes d’absence (V2)</text><line x1="640" y1="473" x2="924" y2="473" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="782.0" y="467" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">8. GET maintenance en attente (2 reports faits)</text><polyline points="640,485 680,485 680,507 646,507" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="660" y1="507" x2="644" y2="507" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="688" y="493" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">9. logiciel ouvert ? sinon installation</text><text x="688" y="509" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">ou redémarrage en attente</text><line x1="640" y1="547" x2="924" y2="547" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="782.0" y="541" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">10. POST résultat : jour, sans heure (jeton)</text><text x="125" y="587" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">L’agent revient</text><line x1="360" y1="610" x2="634" y2="610" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="497.0" y="604" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">11. « présent » → événement 100, lumière verte</text><text x="30" y="730" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">Une installation déjà commencée se termine ; les tâches interruptibles s’arrêtent ; aucun redémarrage avec une session ouverte.</text></svg>