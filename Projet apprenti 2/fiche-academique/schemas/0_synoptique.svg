<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="535" viewBox="0 0 1170 535" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="34" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Synoptique de la maquette au lycée (réseau exploité tel quel, aucune connexion au ministère, aucune donnée réelle)</text><rect x="30" y="60" width="300" height="140" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="180.0" y="82" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Portable testé (Windows 11)</text><text x="180.0" y="105" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">navigateur : page de test (HTTPS)</text><text x="180.0" y="122" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">écran, haut-parleurs, micro</text><text x="180.0" y="139" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">clavier, pavé tactile</text><text x="180.0" y="156" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">webcam, ports USB, Ethernet (V2)</text><text x="180.0" y="173" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">rien n’y est installé</text><rect x="30" y="320" width="300" height="140" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/><text x="180.0" y="342" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Tête de mesure (ESP32, C++)</text><text x="180.0" y="365" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">TCS34725 dans un tube noir : écran</text><text x="180.0" y="382" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">INMP441 : son des haut-parleurs</text><text x="180.0" y="399" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">MAX98357A + haut-parleur : son</text><text x="180.0" y="416" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">envoyé au micro du PC</text><text x="180.0" y="433" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">ESP32-S3 clavier USB, INA219 (V2)</text><line x1="120" y1="202" x2="120" y2="318" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="112" y="264" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="end">lumière, son</text><line x1="240" y1="318" x2="240" y2="202" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="248" y="256" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">son émis</text><text x="248" y="272" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">(test du micro)</text><rect x="440" y="60" width="340" height="170" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/><text x="610.0" y="82" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Station – PC Ubuntu</text><text x="610.0" y="105" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">Flask en HTTPS, WebSocket</text><text x="610.0" y="122" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">enchaîne les étapes du test</text><text x="610.0" y="139" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">SQLite : PC, mesures, rapports</text><text x="610.0" y="156" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">comparaison au rapport précédent</text><text x="610.0" y="173" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">et aux PC sains du même modèle</text><text x="610.0" y="190" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">rapports chaînés (SHA-256)</text><text x="610.0" y="207" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">vérificateur de la chaîne</text><line x1="332" y1="130" x2="438" y2="130" stroke="#6b7280" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="385.0" y="122" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">HTTPS, WebSocket</text><line x1="332" y1="400" x2="480" y2="232" stroke="#6b7280" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="394" y="326" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="end">USB série</text><rect x="440" y="290" width="340" height="80" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="610.0" y="312" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Réseau de la maquette</text><text x="610.0" y="335" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">DHCP, DNS, NTP, switchs, routeur</text><text x="610.0" y="352" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">autorité de certification de labo</text><line x1="610" y1="232" x2="610" y2="288" stroke="#6b7280" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="618" y="266" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">nom, adresse, heure</text><rect x="440" y="395" width="340" height="62" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="610.0" y="417" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Laboratoire de physique</text><text x="610.0" y="440" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">luxmètre, sonomètre : étalonnage</text><line x1="438" y1="426" x2="332" y2="440" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fl)"/><text x="385" y="458" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">étalonnage</text><rect x="880" y="60" width="260" height="76" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="1010.0" y="82" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Interface du technicien</text><text x="1010.0" y="105" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">navigateur : rapports, décision</text><line x1="782" y1="98" x2="878" y2="98" stroke="#6b7280" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="830.0" y="90" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">HTTPS</text><rect x="880" y="160" width="260" height="76" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="1010.0" y="182" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Clé USB hors ligne</text><text x="1010.0" y="205" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">dernier haché, sauvegarde</text><line x1="782" y1="198" x2="878" y2="198" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="830.0" y="190" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">copie du soir</text><rect x="880" y="262" width="260" height="90" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1010.0" y="284" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Switch HP ProCurve (V2)</text><text x="1010.0" y="307" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">port du portable testé :</text><text x="1010.0" y="324" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">vitesse, erreurs (SNMP)</text><line x1="782" y1="225" x2="878" y2="290" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fl)"/><text x="884" y="254" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">SNMP lecture</text><text x="30" y="500" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="start">En bleu : réalisé par l’apprenti. Pointillés : V2 ou ponctuel. La station n’agit jamais sur le portable : elle n’installe rien, ne change aucun</text><text x="30" y="518" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="start">réglage et n’efface rien. Aucun son n’est enregistré, aucune image n’est gardée : seulement des mesures. Les défauts sont provoqués sans rien abîmer.</text></svg>