<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="620" viewBox="0 0 1170 620" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="34" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Synoptique de la maquette au lycée (réseau isolé d’Internet, aucune donnée réelle)</text><rect x="30" y="60" width="300" height="175" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/><text x="180.0" y="82" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Boîte noire (ESP32)</text><text x="180.0" y="105" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">voyants du PC (phototransistors)</text><text x="180.0" y="122" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">5 V de l’USB, courant du lecteur</text><text x="180.0" y="139" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">horloge DS3231, carte microSD</text><text x="180.0" y="156" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">supercondensateur (réserve)</text><text x="180.0" y="173" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">LED de prévention ; sans radio</text><rect x="30" y="300" width="300" height="100" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="180.0" y="322" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Lecteur de carte</text><text x="180.0" y="345" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">carte PIV de laboratoire</text><text x="180.0" y="362" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">relié par un USB instrumenté</text><line x1="180" y1="298" x2="180" y2="237" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="190" y="272" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">courant mesuré</text><rect x="420" y="60" width="330" height="200" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="585.0" y="82" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Poste Windows 11</text><text x="585.0" y="105" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">agent « battement » (chaque seconde)</text><text x="585.0" y="122" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">collecteur au démarrage</text><text x="585.0" y="139" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">récit + journaux Windows</text><text x="585.0" y="156" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">diagnostic de la chaîne carte</text><text x="585.0" y="173" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">(5 maillons, remèdes à paliers)</text><text x="585.0" y="190" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">corrélateur → cause probable</text><line x1="330" y1="150" x2="418" y2="150" stroke="#6b7280" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="374.0" y="142" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">USB</text><line x1="330" y1="350" x2="418" y2="230" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="390" y="305" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">USB</text><rect x="840" y="60" width="290" height="140" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/><text x="985.0" y="82" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Serveur Ubuntu</text><text x="985.0" y="105" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">API Python (FastAPI)</text><text x="985.0" y="122" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">base SQLite</text><text x="985.0" y="139" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">page web du support</text><text x="985.0" y="156" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">tableaux de bord</text><line x1="750" y1="130" x2="838" y2="130" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="794.0" y="122" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">HTTPS + jeton</text><rect x="840" y="260" width="290" height="90" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="985.0" y="282" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Portail sécurisé de labo</text><text x="985.0" y="305" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">exige un certificat client</text><text x="985.0" y="322" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">(TLS mutuel)</text><line x1="750" y1="230" x2="838" y2="300" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="845" y="252" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">mTLS (certificat de la carte)</text><rect x="420" y="330" width="330" height="110" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="585.0" y="352" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Contrôleur de domaine commun</text><text x="585.0" y="375" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">AD DS, DNS, NTP, AD CS (PKI de labo)</text><text x="585.0" y="392" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">préparé une fois pour la maquette,</text><text x="585.0" y="409" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">utilisé sans être administré</text><line x1="585" y1="328" x2="585" y2="262" stroke="#6b7280" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="595" y="300" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">DNS, Kerberos, LDAP, SMB, NTP</text><rect x="840" y="400" width="290" height="80" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="985.0" y="422" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Routeur Cisco ISR 4331</text><text x="985.0" y="445" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">passerelle, source NTP</text><line x1="838" y1="430" x2="752" y2="400" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="795.0" y="405" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">NTP</text><rect x="420" y="480" width="330" height="80" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="585.0" y="502" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Navigateur du technicien</text><text x="585.0" y="525" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">incidents, statistiques</text><polyline points="750,520 1145,520 1145,130 1140,130" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="1145" y1="130" x2="1132" y2="130" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="950" y="512" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">HTTPS (vers le serveur)</text><text x="30" y="600" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="start">En bleu : réalisé par l’apprenti (boîtier, serveur). Le boîtier ne parle qu’au poste, par USB ; seul le poste parle au serveur.</text></svg>