 font-weight="normal" fill="#6b7280" text-anchor="start">10</text><rect x="20" y="97" width="1130" height="24" fill="#f9fafb"/><text x="28" y="114" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">Cadrage</text><text x="38" y="142" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">1. Besoin chiffré, cahier des charges, planning (10 h)</text><rect x="465.55555555555554" y="129" width="98.51851851851859" height="16" rx="3" fill="#7c3aed" opacity="0.85"/><text x="38" y="170" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">2. Maquette : station Ubuntu, HTTPS, portables (10 h)</text><rect x="501.85185185185185" y="157" width="98.51851851851859" height="16" rx="3" fill="#059669" opacity="0.85"/><rect x="20" y="181" width="1130" height="24" fill="#f9fafb"/><text x="28" y="198" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">V1 – mesurer, comparer, garder une trace fiable</text><text x="38" y="226" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">3. Tête de mesure : couleur, micro, émetteur, support (20 h)</text><rect x="538.1481481481482" y="213" width="243.7037037037037" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><text x="38" y="254" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">4. Physique : étalonnage, gamma, son, seuils (18 h)</text><rect x="610.7407407407408" y="241" width="280.0" height="16" rx="3" fill="#d97706" opacity="0.85"/><text x="38" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">5. Page de test : couleurs, sons, micro, clavier (18 h)</text><rect x="610.7407407407408" y="269" width="207.4074074074074" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><text x="38" y="310" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">6. Station : étapes, base, comparaison, rapport (16 h)</text><rect x="683.3333333333334" y="297" width="171.1111111111111" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><text x="38" y="338" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">7. Rapports chaînés, vérificateur, comptes (8 h)</text><rect x="792.2222222222222" y="325" width="98.51851851851859" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><text x="38" y="366" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">8. Réseau : DHCP, DNS, NTP, TLS, captures (8 h)</text><rect x="647.0370370370371" y="353" width="316.2962962962963" height="16" rx="3" fill="#059669" opacity="0.85"/><rect x="20" y="377" width="1130" height="24" fill="#f9fafb"/><text x="28" y="394" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">V2 – connectique et statistiques</text><text x="38" y="422" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">9. Webcam, USB, Ethernet (SNMP), statistiques (18 h)</text><rect x="901.1111111111111" y="409" width="171.1111111111111" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><text x="38" y="450" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">10. Campagne d’essai, défauts provoqués, bilan (12 h)</text><rect x="1010.0" y="437" width="98.51851851851848" height="16" rx="3" fill="#7c3aed" opacity="0.85"/><text x="38" y="478" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">11. Dossier et préparation de l’oral (12 h)</text><rect x="1082.5925925925926" y="465" width="62.22222222222217" height="16" rx="3" fill="#db2777" opacity="0.85"/><text x="38" y="506" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Journal de bord, journal IA, réunions (tout le long)</text><rect x="465.55555555555554" y="493" width="679.2592592592592" height="16" rx="3" fill="#7c3aed" opacity="0.85"/><polyline points="468.14814814814815,74 468.14814814814815,523" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M468.14814814814815,521 l8,8 l-8,8 l-8,-8 z" fill="#dc2626"/><text x