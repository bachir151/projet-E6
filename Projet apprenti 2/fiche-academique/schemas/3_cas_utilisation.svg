<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="30" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Diagramme des cas d’utilisation (uc)</text><rect x="230" y="50" width="640" height="590" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="550.0" y="72" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Système « Boîte noire du poste »</text><ellipse cx="420" cy="105" rx="145" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="420" y="102" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Enregistrer les événements</text><text x="420" y="119" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">du poste (récit horodaté)</text><ellipse cx="420" cy="185" rx="145" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="420" y="182" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Obtenir la cause probable</text><text x="420" y="199" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">d’une panne</text><ellipse cx="700" cy="185" rx="125" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="700" y="182" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Lire les journaux</text><text x="700" y="199" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Windows</text><ellipse cx="420" cy="265" rx="145" ry="27" fill="#fff" stroke="#1d4ed8" stroke-w