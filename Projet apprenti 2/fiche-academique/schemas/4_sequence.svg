<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="745" viewBox="0 0 1080 745" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="30" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Diagramme de séquence (sd) – une mise à jour interrompue par un arrêt forcé</text><rect x="75" y="60" width="150" height="40" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.4"/><text x="150" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Boîte noire</text><polyline points="150,100 150,700" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="355" y="60" width="150" height="40" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="430" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Poste (agent)</text><polyline points="430,100 430,700" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="645" y="60" width="150" height="40" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.4"/><text x="720" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Serveur</text><polyline points="720,100 720,700" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="960" cy="52" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="960,62 960,90" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="944,72 976,72" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="947,112 960,90 973,112" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="960" y="132" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle"></text><text x="960" y="142" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Technicien</text><polyline points="960,152 960,700" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><text x="160" y="166" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">Pendant l’installation d’une mise à jour :</text><line x1="430" y1="195" x2="156" y2="195" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="293.0" y="189" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">1. battement + « mise à jour en cours » (USB)</text><polyline points="150,210 190,210 190,232 156,232" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="170" y1="232" x2="154" y2="232" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="198" y="218" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">2. LED orange « ne pas éteindre »,</text><text x="198" y="234" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">horodate et écrit le récit chaîné</text><text x="160" y="280" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">L’agent appuie longtemps sur le bouton :</text><polyline points="150,290 190,290 190,312 156,312" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="170" y1="312" x2="154" y2="312" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="198" y="298" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">3. battement perdu, voyant éteint ≈ 4 s</text><text x="198" y="314" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">après → « arrêt forcé » (réserve d’énergie)</text><text x="160" y="360" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">Au redémarrage :</text><line x1="430" y1="380" x2="156" y2="380" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="293.0" y="374" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">4. défi (HMAC)</text><line x1="150" y1="415" x2="424" y2="415" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="287.0" y="409" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">5. réponse + récit depuis la dernière lecture</text><polyline points="430,435 470,435 470,457 436,457" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="450" y1="457" x2="434" y2="457" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="478" y="443" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">6. lit Kernel-Power 41 et Windows Update,</text><text x="478" y="459" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">corrélateur : « mise à jour interrompue »</text><line x1="430" y1="500" x2="714" y2="500" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="572.0" y="494" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">7. POST conclusion (HTTPS + jeton)</text><line x1="960" y1="555" x2="726" y2="555" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="843.0" y="549" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">8. ouvre la page web du support</text><line x1="720" y1="590" x2="954" y2="590" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="837.0" y="584" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">9. cause probable + remède proposé</text><text x="30" y="730" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">Serveur arrêté : le poste garde la conclusion en file d’attente. Sources en désaccord : « non concluant ».</text></svg>