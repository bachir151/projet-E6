<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="950" viewBox="0 0 1160 950" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="30" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Diagramme de séquence (sd) – restitution du PC-042 : le haut-parleur droit est devenu trop faible</text><circle cx="70" cy="52" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="70,62 70,90" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="54,72 86,72" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="57,112 70,90 83,112" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="70" y="132" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle"></text><text x="70" y="142" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Technicien</text><polyline points="70,152 70,905" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="178" y="60" width="144" height="40" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="250" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Page de test</text><polyline points="250,100 250,905" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="398" y="60" width="144" height="40" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.4"/><text x="470" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Station</text><polyline points="470,100 470,905" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="608" y="60" width="144" height="40" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.4"/><text x="680" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Tête de mesure</text><polyline points="680,100 680,905" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="798" y="60" width="144" height="40" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="870" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Base SQLite</text><polyline points="870,100 870,905" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="988" y="60" width="144" height="40" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="1060" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Clé USB</text><polyline points="1060,100 1060,905" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><text x="30" y="168" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">14:02 – Karim rend le PC-042 ; Yaksan le pose sur la station et ouvre la page de test</text><line x1="70" y1="196" x2="244" y2="196" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="157.0" y="190" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">1. PC-042, « restitution »</text><line x1="250" y1="228" x2="464" y2="228" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="357.0" y="222" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">2. test demandé (HTTPS)</text><line x1="470" y1="260" x2="864" y2="260" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="667.0" y="254" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">3. rapport de remise du PC-042 ?</text><line x1="870" y1="292" x2="476" y2="292" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="673.0" y="286" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">4. rapport + empreintes</text><polyline points="470,308 510,308 510,330 476,330" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="490" y1="330" x2="474" y2="330" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="518" y="316" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">5. chaîne vérifiée : intacte</text><text x="30" y="360" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">écran : 17 niveaux de gris, puis rouge, vert, bleu</text><line x1="470" y1="386" x2="256" y2="386" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="363.0" y="380" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">6. afficher le gris n</text><line x1="470" y1="418" x2="674" y2="418" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="572.0" y="412" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">7. mesurer la lumière (USB)</text><line x1="680" y1="450" x2="476" y2="450" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="578.0" y="444" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">8. luminance, couleurs</text><text x="30" y="490" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">son : 3 fréquences, à gauche puis à droite ; puis le micro du PC</text><line x1="470" y1="516" x2="256" y2="516" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="363.0" y="510" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">9. jouer 1 kHz à droite</text><line x1="470" y1="548" x2="674" y2="548" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="572.0" y="542" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">10. écouter</text><line x1="680" y1="580" x2="476" y2="580" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="578.0" y="574" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">11. −18 dB / remise</text><line x1="470" y1="612" x2="674" y2="612" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="572.0" y="606" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">12. émettre 2 kHz</text><line x1="250" y1="644" x2="464" y2="644" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="357.0" y="638" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">13. 2 kHz reçu (Web Audio)</text><polyline points="470,662 510,662 510,684 476,684" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="490" y1="684" x2="474" y2="684" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="518" y="670" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">14. comparer aux références :</text><text x="518" y="686" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">écran OK, haut-parleur droit hors seuil</text><line x1="470" y1="728" x2="256" y2="728" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="363.0" y="722" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">15. proposé : « à réparer »</text><line x1="70" y1="760" x2="244" y2="760" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="157.0" y="754" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">16. valide la décision</text><line x1="470" y1="792" x2="864" y2="792" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="667.0" y="786" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">17. rapport chaîné (empreinte du précédent, heure NTP)</text><text x="30" y="832" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">20:00</text><line x1="470" y1="858" x2="1054" y2="858" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="762.0" y="852" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">18. dernier haché copié (hors ligne)</text><text x="30" y="935" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">La station mesure et propose ; le technicien décide. Si la chaîne était rompue à l’étape 5, la comparaison serait refusée et le technicien alerté.</text></svg>