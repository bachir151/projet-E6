<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="575" viewBox="0 0 1125 575" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="30" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Diagramme d’exigences (req) – chaque exigence a un indicateur mesuré sur la maquette</text><rect x="330" y="48" width="460" height="92" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/><text x="560.0" y="65" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="560.0" y="85" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">E0 – Boîte noire du poste</text><text x="560.0" y="108" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Comprendre et prévenir les pannes, les mises à jour</text><text x="560.0" y="126" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">ratées et les échecs de connexion par carte</text><circle cx="560.0" cy="154" r="8" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><polyline points="552.0,154 568.0,154" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="560.0,146 560.0,162" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="560.0,162 560.0,180" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="157.5,180 967.5,180" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="30" y="205" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="157.5" y="221" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="157.5" y="238" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E1 – Témoigner</text><polyline points="30,247 285,247" fill="none" stroke="#4b5563" stroke-width="1"/><text x="38" y="265" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Classer arrêt normal, coupure,</text><text x="38" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">arrêt forcé, système figé :</text><text x="38" y="299" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">au moins 19 pannes sur 20</text><text x="38" y="335" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : 20 pannes provoquées</text><polyline points="157.5,180 157.5,205" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="300" y="205" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="427.5" y="221" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="427.5" y="238" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E2 – Mémoire</text><polyline points="300,247 555,247" fill="none" stroke="#4b5563" stroke-width="1"/><text x="308" y="265" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Récit horodaté gardé après</text><text x="308" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">une coupure secteur</text><text x="308" y="299" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">(réserve d’énergie)</text><text x="308" y="335" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : coupures + P3</text><polyline points="427.5,180 427.5,205" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="570" y="205" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="697.5" y="221" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="697.5" y="238" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E3 – Expliquer</text><polyline points="570,247 825,247" fill="none" stroke="#4b5563" stroke-width="1"/><text x="578" y="265" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Croiser récit et journaux</text><text x="578" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Windows : cause probable</text><text x="578" y="299" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">ou « non concluant »</text><text x="578" y="335" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : mises à jour ratées</text><polyline points="697.5,180 697.5,205" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="840" y="205" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="967.5" y="221" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="967.5" y="238" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E4 – Chaîne carte</text><polyline points="840,247 1095,247" fill="none" stroke="#4b5563" stroke-width="1"/><text x="848" y="265" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Désigner le premier maillon</text><text x="848" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">en panne : 100 % des cas</text><text x="848" y="299" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">sur la maquette (V2)</text><text x="848" y="335" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : pannes de maillons</text><polyline points="967.5,180 967.5,205" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="30" y="395" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="157.5" y="411" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="157.5" y="428" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E5 – Prévenir</text><polyline points="30,437 285,437" fill="none" stroke="#4b5563" stroke-width="1"/><text x="38" y="455" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">LED orange pendant une</text><text x="38" y="472" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">mise à jour : arrêts forcés</text><text x="38" y="489" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">en baisse (V2)</text><text x="38" y="525" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : mesure avant / après</text><polyline points="157.5,370 157.5,395" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="300" y="395" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="427.5" y="411" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="427.5" y="428" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E6 – Accompagner</text><polyline points="300,437 555,437" fill="none" stroke="#4b5563" stroke-width="1"/><text x="308" y="455" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Test de la carte le 1er jour ;</text><text x="308" y="472" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">libre-service avec un</text><text x="308" y="489" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">message simple (V2)</text><text x="308" y="525" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : scénarios d’accueil</text><polyline points="427.5,370 427.5,395" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="570" y="395" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="697.5" y="411" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="697.5" y="428" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E7 – Sécurité</text><polyline points="570,437 825,437" fill="none" stroke="#4b5563" stroke-width="1"/><text x="578" y="455" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Faux boîtier démasqué, ligne</text><text x="578" y="472" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">effacée détectée, API avec</text><text x="578" y="489" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">jeton et TLS</text><text x="578" y="525" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : démonstration d’attaque</text><polyline points="697.5,370 697.5,395" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="840" y="395" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="967.5" y="411" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="967.5" y="428" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E8 – Physique</text><polyline points="840,437 1095,437" fill="none" stroke="#4b5563" stroke-width="1"/><text x="848" y="455" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Seuils, échantillonnage,</text><text x="848" y="472" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">énergie, carte vivante,</text><text x="848" y="489" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">dérive d’horloge (P1–P6)</text><text x="848" y="525" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : mesures + incertitudes</text><polyline points="967.5,370 967.5,395" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="157.5,370 967.5,370" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="967.5,180 1107,180 1107,370 967.5,370" fill="none" stroke="#6b7280" stroke-width="1.5"/><text x="30" y="562" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">Le symbole ⊕ indique que E0 se décompose en E1 à E8. V1 : E1, E2, E3. V2 : E4 à E7. E8 : tout le long.</text></svg>