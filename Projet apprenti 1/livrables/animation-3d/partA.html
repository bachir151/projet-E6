<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maquette 3D imprimante</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Scène 3D plein écran, toujours sur fond sombre (lumières et paquets lumineux).
   Le panneau d'explication suit le thème clair / sombre. */
:root{
  --bg:#0b1016; --panel:rgba(255,255,255,.92); --ink:#13222c; --muted:#56656f; --line:#d3dde2;
  --accent:#1d5a86; --chip:#eef3f6;
  --kit:#3ddc84; --req:#9fd0ff; --rep:#4aa8ff; --borne:#ffb020; --capt:#c18cff; --err:#ff5a4d;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --panel:rgba(16,24,31,.88); --ink:#e4ecf0; --muted:#9aabb5; --line:#2a3a45; --accent:#6fb0de; --chip:#1c2a34; color-scheme:dark}}
:root[data-theme="dark"]{
  --panel:rgba(16,24,31,.88); --ink:#e4ecf0; --muted:#9aabb5; --line:#2a3a45; --accent:#6fb0de; --chip:#1c2a34; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--f-body);color:var(--ink)}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #f0b93a;outline-offset:2px}

/* étiquettes 3D */
.lab{font-family:var(--f-body);font-size:12px;line-height:1.25;color:#e9f1f5;background:rgba(10,16,22,.78);
  border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:4px 8px;white-space:nowrap;transform:translateY(-14px)}
/* les étiquettes bougent à chaque image : une couche GPU chacune, sans ombre portée (moins de travail pour le navigateur) */
#labels>div{will-change:transform}
.lab b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em;display:block}
.lab span{color:#a9bac4}
.lab.small{font-size:11px;padding:2px 6px}
.lab.small b{font-size:13px}
.pkt{font-family:var(--f-mono);font-size:11.5px;color:#fff;background:rgba(8,12,16,.82);border:1px solid currentColor;
  border-radius:999px;padding:2px 8px;white-space:nowrap;transform:translateY(-16px)}
.pkt i{font-style:normal;color:#fff}
.read{font-family:var(--f-mono);font-size:12px;color:#fff;background:rgba(8,12,16,.85);border-left:3px solid var(--capt);
  border-radius:4px;padding:3px 8px;white-space:nowrap}

/* barre du haut */
#top{position:fixed;top:max(12px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#top>*{pointer-events:auto}
#brand{color:#e4ecf0;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#brand .eye{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6fb0de}
#brand h1{font-family:var(--f-display);font-size:26px;line-height:1.05;margin:2px 0 0;font-weight:700}
#tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;backdrop-filter:blur(8px)}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:6px;font-size:13px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 11px;font-size:13px;backdrop-filter:blur(8px)}
.tbtn[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}

/* panneau d'explication */
#panel{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:min(470px,calc(100vw - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;backdrop-filter:blur(10px);
  box-shadow:0 8px 30px rgba(0,0,0,.35)}
#stepno{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
#title{font-family:var(--f-display);font-size:25px;font-weight:700;line-height:1.08;margin:3px 0 6px}
#text{font-size:14.5px;line-height:1.5;margin:0;max-height:34vh;overflow:auto}
#text p{margin:0 0 6px}
#text code{font-family:var(--f-mono);font-size:.86em;background:var(--chip);padding:0 4px;border-radius:4px}
#note{font-size:13px;color:var(--muted);margin-top:4px;border-left:3px solid #f0b93a;padding-left:8px;display:none}
#ctrl{display:flex;align-items:center;gap:6px;margin-top:10px}
#ctrl button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:7px 11px;font-size:14px;font-weight:700}
#ctrl button.main{background:var(--accent);border-color:var(--accent);color:#fff}
#dots{display:flex;gap:5px;margin-left:auto}
#dots button{width:10px;height:10px;padding:0!important;border-radius:50%!important;background:var(--line)!important;border:0!important}
#dots button.on{background:var(--accent)!important;transform:scale(1.25)}
#legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px;font-size:12px;color:var(--muted)}
#legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c);box-shadow:0 0 6px var(--c);vertical-align:-1px}
#hint{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));font-size:12px;color:#8fa3ae;text-align:right;text-shadow:0 1px 4px #000}
#err{position:fixed;inset:0;display:none;place-items:center;color:#e4ecf0;font-size:18px;padding:30px;text-align:center}
@media (max-width:720px){
  #brand h1{font-size:20px}
  #title{font-size:21px}
  #text{font-size:13.5px;max-height:24vh}
  #hint{display:none}
  #legend{display:none}
  .lab{font-size:10.5px;padding:3px 6px}.lab b{font-size:13px}
}
</style>
