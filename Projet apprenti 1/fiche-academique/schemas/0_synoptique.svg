<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="530" viewBox="0 0 1160 530" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="34" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Synoptique de la maquette au lycée (réseau exploité tel quel, aucune connexion à l’hôpital, aucune donnée réelle)</text><rect x="30" y="60" width="300" height="175" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/><text x="180.0" y="82" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Boîtier du chariot</text><text x="180.0" y="105" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">ESP32 (C++), batterie Li-Po de secours</text><text x="180.0" y="122" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">MPU6050 : secousses (100 Hz)</text><text x="180.0" y="139" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">INA219 : 5 V de l’USB du PC</text><text x="180.0" y="156" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">SHT31 : température, humidité</text><text x="180.0" y="173" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">heure NTP, numéro de séquence</text><text x="180.0" y="190" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">mémoire flash si Wi-Fi coupé</text><rect x="420" y="60" width="330" height="175" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/><text x="585.0" y="82" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Serveur – PC Ubuntu</text><text x="585.0" y="105" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">Mosquitto (MQTT sur TLS)</text><text x="585.0" y="122" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">service Python : règles, corrélation</text><text x="585.0" y="139" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">pilote le diagnostic et GLPI</text><text x="585.0" y="156" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">PostgreSQL : mesures et événements</text><text x="585.0" y="173" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">rapport ; frise Grafana (V2)</text><line x1="330" y1="120" x2="418" y2="120" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="374.0" y="112" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">MQTT / TLS</text><text x="374" y="140" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">Wi-Fi, 8883</text><rect x="840" y="60" width="290" height="175" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="985.0" y="82" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">PC du chariot – Windows</text><text x="985.0" y="105" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">portable de récupération</text><text x="985.0" y="122" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">point d’accès WinRM restreint (JEA)</text><text x="985.0" y="139" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">script PowerShell de diagnostic :</text><text x="985.0" y="156" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">journal, batterie, disque</text><text x="985.0" y="173" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">lecture seule, aucune correction</text><line x1="750" y1="140" x2="838" y2="140" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="794.0" y="132" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">WinRM HTTPS</text><text x="794" y="160" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">5986</text><rect x="420" y="320" width="330" height="100" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/><text x="585.0" y="342" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">GLPI dans Docker</text><text x="585.0" y="365" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">données fictives</text><text x="585.0" y="382" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">compte de service à droits limités</text><line x1="585" y1="237" x2="585" y2="318" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="595" y="282" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">API REST (HTTPS)</text><rect x="880" y="320" width="250" height="80" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="1005.0" y="342" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">PC du technicien</text><text x="1005.0" y="365" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">navigateur : tickets GLPI</text><line x1="878" y1="360" x2="752" y2="360" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="815" y="352" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">HTTPS</text><rect x="30" y="320" width="300" height="100" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="180.0" y="342" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Réseau de la maquette</text><text x="180.0" y="365" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">Wi-Fi, DHCP, DNS, NTP</text><text x="180.0" y="382" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">routeur Cisco ISR 4331</text><text x="180.0" y="399" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">exploité, non reconfiguré</text><line x1="180" y1="318" x2="180" y2="237" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="190" y="285" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">NTP, DHCP, DNS</text><polyline points="858,237 858,470 370,470 370,200" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="370" y1="200" x2="332" y2="200" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="614" y="462" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">Câble USB : le PC alimente le boîtier, qui mesure ce 5 V (aucune donnée échangée)</text><text x="30" y="510" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="start">En bleu : réalisé par l’apprenti (boîtier, service et base du serveur, GLPI de test). Le script PowerShell et le point JEA sont aussi écrits par l’apprenti.</text></svg>