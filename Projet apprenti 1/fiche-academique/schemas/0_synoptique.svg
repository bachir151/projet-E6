 y="452" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Réseau de la maquette</text><text x="985.0" y="475" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">Wi-Fi, DHCP, DNS, NTP, switchs, routeur</text><text x="30" y="545" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="start">En bleu : réalisé par l’apprenti. Pointillés : V2. Windows 11 Famille ne peut rejoindre aucun domaine : les PC Windows sont des machines</text><text x="30" y="563" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="start">virtuelles Windows 11 Entreprise (version d’évaluation) ou des PC sous Windows 11 Pro. L’AD est simulé par Samba sur Ubuntu.</text></svg>