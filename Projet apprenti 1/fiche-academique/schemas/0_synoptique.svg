font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">CUPS : serveur d’impression</text><text x="570.0" y="139" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">service Python : compare les témoins</text><text x="570.0" y="156" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">PostgreSQL, tableau de bord</text><text x="570.0" y="173" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">interroge l’imprimante (SNMP),</text><text x="570.0" y="190" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">le PC (JEA) et l’AD (LDAP)</text><line x1="300" y1="140" x2="398" y2="140" stroke="#6b7280" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="349.0" y="132" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">MQTT / TLS</text><rect x="30" y="260" width="270" height="100" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="165.0" y="282" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Imprimante réseau</text><text x="165.0" y="305" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">du lycée ou de récupération</text><text x="165.0" y="322" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">SNMP (état, encre), IPP</text><line x1="400" y1="230" x2="302" y2="290" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="352" y="250" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="end">SNMP, IPP</text><rect x="30" y="400" width="270" height="100" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/><text x="165.0" y="422" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Station des PC neufs (V2)</text><text x="165.0" y="445" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">ESP32, lecteur RFID</text><text x="165.0" y="462" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">écran, LED, bouton</text><line x1="302" y1="440" x2="430" y2="252" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fl)"/><text x="324" y="424" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start">MQTT / TLS</text><rect x="400" y="320" width="160" height="118" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="480.0" y="342" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">PC secrétaire</text><text x="480.0" y="365" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">VM Windows 11</text><text x="480.0" y="382" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">Entreprise</text><text x="480.0" y="399" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">point d’accès JEA</text><line x1="480" y1="252" x2="480" y2="318" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="486" y="290" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start">WinRM HTTPS</text><rect x="580" y="320" width="160" height="118" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4"/><text x="660.0" y="342" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">PC neuf (V2)</text><text x="660.0" y="365" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">VM Windows 11</text><text x="660.0" y="382" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">Entreprise</text><text x="660.0" y="399" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">script PowerShell</text><line x1="660" y1="252" x2="660" y2="318" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fl)"/><text x="666" y="290" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start">commande</text><rect x="840" y="60" width="290" height="100" rx="8" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/><text x="98