<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="695" viewBox="0 0 1090 695" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="30" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Diagramme des cas d’utilisation (uc)</text><rect x="230" y="50" width="640" height="600" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="550.0" y="72" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Système « Le service informatique augmenté »</text><ellipse cx="400" cy="105" rx="140" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="400" y="102" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Surveiller l’impression</text><text x="400" y="119" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">(vibration, feuilles)</text><ellipse cx="400" cy="185" rx="140" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="400" y="182" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Signaler une panne</text><text x="400" y="199" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">(bouton)</text><ellipse cx="400" cy="265" rx="140" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="400" y="262" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Lire le ticket et</text><text x="400" y="279" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">le tableau de bord</text><ellipse cx="400" cy="345" rx="140" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="400" y="342" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Valider une action</text><text x="400" y="359" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">proposée (palier 2)</text><ellipse cx="400" cy="425" rx="140" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="400" y="422" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Pointer une intervention</text><text x="400" y="439" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">avec sa carte (V2)</text><ellipse cx="400" cy="505" rx="140" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="400" y="502" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Préparer un PC neuf</text><text x="400" y="519" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">avec 3 cartes (V2)</text><ellipse cx="400" cy="585" rx="140" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="400" y="582" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Régler les seuils</text><text x="400" y="599" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">et le palier</text><ellipse cx="720" cy="145" rx="125" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="720" y="142" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Comparer les témoins,</text><text x="720" y="159" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">trouver la cause</text><ellipse cx="720" cy="225" rx="125" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="720" y="222" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Interroger</text><text x="720" y="239" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">l’imprimante (SNMP)</text><ellipse cx="720" cy="305" rx="125" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="720" y="302" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Lire la file</text><text x="720" y="319" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">du PC (JEA)</text><ellipse cx="720" cy="385" rx="125" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="720" y="382" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Ouvrir ou compléter</text><text x="720" y="399" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">le ticket (paliers)</text><ellipse cx="720" cy="465" rx="125" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="720" y="462" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Afficher l’état</text><text x="720" y="479" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">sur le boîtier</text><ellipse cx="720" cy="545" rx="125" ry="27" fill="#fff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="720" y="542" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Ranger le PC dans le</text><text x="720" y="559" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">bon service (V2)</text><line x1="530" y1="115" x2="600" y2="135" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="548" y="112" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start" font-style="italic">«include»</text><line x1="720" y1="172" x2="720" y2="196" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="728" y="190" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start" font-style="italic">«include»</text><line x1="720" y1="252" x2="720" y2="276" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="728" y="270" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start" font-style="italic">«include»</text><line x1="530" y1="515" x2="600" y2="535" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="548" y="512" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start" font-style="italic">«include»</text><circle cx="110" cy="90" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="110,100 110,128" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="94,110 126,110" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="97,150 110,128 123,150" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="110" y="170" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Secrétaire</text><circle cx="110" cy="380" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="110,390 110,418" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="94,400 126,400" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="97,440 110,418 123,440" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="110" y="460" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Technicien</text><circle cx="990" cy="160" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="990,170 990,198" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="974,180 1006,180" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="977,220 990,198 1003,220" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="990" y="240" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Imprimante</text><circle cx="990" cy="290" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="990,300 990,328" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="974,310 1006,310" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="977,350 990,328 1003,350" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="990" y="370" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">PC secrétaire</text><circle cx="990" cy="420" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="990,430 990,458" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="974,440 1006,440" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="977,480 990,458 1003,480" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="990" y="500" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">GLPI</text><circle cx="990" cy="540" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="990,550 990,578" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="974,560 1006,560" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="977,600 990,578 1003,600" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="990" y="620" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">AD (Samba)</text><polyline points="130,115 260,105" fill="none" stroke="#4b5563" stroke-width="1.2"/><polyline points="130,115 260,185" fill="none" stroke="#4b5563" stroke-width="1.2"/><polyline points="130,405 260,265" fill="none" stroke="#4b5563" stroke-width="1.2"/><polyline points="130,405 260,345" fill="none" stroke="#4b5563" stroke-width="1.2"/><polyline points="130,405 260,425" fill="none" stroke="#4b5563" stroke-width="1.2"/><polyline points="130,405 260,505" fill="none" stroke="#4b5563" stroke-width="1.2"/><polyline points="130,405 260,585" fill="none" stroke="#4b5563" stroke-width="1.2"/><polyline points="970,185 845,225" fill="none" stroke="#4b5563" stroke-width="1.2"/><polyline points="970,315 845,305" fill="none" stroke="#4b5563" stroke-width="1.2"/><polyline points="970,445 845,385" fill="none" stroke="#4b5563" stroke-width="1.2"/><polyline points="970,565 845,545" fill="none" stroke="#4b5563" stroke-width="1.2"/><text x="30" y="680" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">Pointillés : V2. Le système ne supprime aucun ticket ; il ne le ferme qu’avec une preuve (page de test vue, ou feuilles qui ressortent).</text></svg>