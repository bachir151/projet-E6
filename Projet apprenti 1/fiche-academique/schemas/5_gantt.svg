chor="start">8</text><polyline points="805.5555555555555,74 805.5555555555555,515" fill="none" stroke="#eef0f3" stroke-width="1"/><text x="807.5555555555555" y="88" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="start">15</text><polyline points="844.4444444444445,74 844.4444444444445,515" fill="none" stroke="#eef0f3" stroke-width="1"/><text x="846.4444444444445" y="88" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="start">22</text><polyline points="883.3333333333333,74 883.3333333333333,515" fill="none" stroke="#eef0f3" stroke-width="1"/><text x="885.3333333333333" y="88" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="start">29</text><polyline points="922.2222222222222,74 922.2222222222222,515" fill="none" stroke="#eef0f3" stroke-width="1"/><text x="924.2222222222222" y="88" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="start">5</text><polyline points="961.1111111111111,74 961.1111111111111,515" fill="none" stroke="#eef0f3" stroke-width="1"/><text x="963.1111111111111" y="88" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="start">12</text><polyline points="1000.0,74 1000.0,515" fill="none" stroke="#eef0f3" stroke-width="1"/><text x="1002.0" y="88" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="start">19</text><polyline points="1038.888888888889,74 1038.888888888889,515" fill="none" stroke="#eef0f3" stroke-width="1"/><text x="1040.888888888889" y="88" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="start">26</text><polyline points="1077.7777777777778,74 1077.7777777777778,515" fill="none" stroke="#eef0f3" stroke-width="1"/><text x="1079.7777777777778" y="88" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="start">3</text><polyline points="1116.6666666666665,74 1116.6666666666665,515" fill="none" stroke="#eef0f3" stroke-width="1"/><text x="1118.6666666666665" y="88" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="start">10</text><rect x="20" y="97" width="1130" height="24" fill="#f9fafb"/><text x="28" y="114" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">Cadrage</text><text x="38" y="142" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">1. Besoin, cahier des charges, planning (12 h)</text><rect x="416.6666666666667" y="129" width="105.55555555555549" height="16" rx="3" fill="#7c3aed" opacity="0.85"/><rect x="20" y="153" width="1130" height="24" fill="#f9fafb"/><text x="28" y="170" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">V1 – voir la panne et ouvrir le ticket</text><text x="38" y="198" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">2. Boîtier : câblage, secousses, MQTT, mémoire (35 h)</text><rect x="494.44444444444446" y="185" width="261.1111111111111" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><text x="38" y="226" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">5. Diagnostic : PowerShell, WinRM, JEA (18 h)</text><rect x="533.3333333333333" y="213" width="338.8888888888889" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><text x="38" y="254" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">3. Physique : étalonnage, chutes, incertitudes (10 h)</text><rect x="572.2222222222222" y="241" width="222.22222222222229" height="16" rx="3" fill="#d97706" opacity="0.85"/><text x="38" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">8. Réseau : DHCP, DNS, NTP, captures (8 h)</text><rect x="611.1111111111111" y="269" width="338.8888888888889" height="16" rx="3" fill="#059669" opacity="0.85"/><text x="38" y="310" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">4. Serveur : réception, base, règles (20 h)</text><rect x="650.0" y="297" width="183.33333333333326" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><text x="38" y="338" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">6. GLPI : installation, API, paliers (15 h)</text><rect x="805.5555555555555" y="325" width="183.33333333333337" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><text x="38" y="366" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">7. Corrélation SQL, rapport (12 h)</text><rect x="883.3333333333333" y="353" width="105.55555555555566" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><rect x="20" y="377" width="1130" height="24" fill="#f9fafb"/><text x="28" y="394" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">V2 – mesurer et conclure</text><text x="38" y="422" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">7. (suite) Frise Grafana, température, palier 3</text><rect x="961.1111111111111" y="409" width="66.66666666666674" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><text x="38" y="450" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">9. Campagne d’essai, indicateurs, bilan (10 h)</text><rect x="1000.0" y="437" width="105.55555555555566" height="16" rx="3" fill="#7c3aed" opacity="0.85"/><text x="38" y="478" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">10. Dossier et préparation de l’oral (10 h)</text><rect x="1077.7777777777778" y="465" width="66.66666666666652" height="16" rx="3" fill="#db2777" opacity="0.85"/><text x="38" y="506" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Journal de bord, journal IA, réunions (tout le long)</text><rect x="416.6666666666667" y="493" width="727.7777777777776" height="16" rx="3" fill="#7c3aed" opacity="0.85"/><polyline points="419.44444444444446,74 419.44444444444446,523" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M419.44444444444446,521 l8,8 l-8,8 l-8,-8 z" fill="#dc2626"/><text x="419.44444444444446" y="553" font-size="12.5" font-weight="bold" fill="#dc2626" text-anchor="middle">Début</text><text x="419.44444444444446" y="568" font-size="11" font-weight="normal" fill="#dc2626" text-anchor="middle">04/01</text><polyline points="558.3333333333334,74 558.3333333333334,523" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M558.3333333333334,521 l8,8 l-8,8 l-8,-8 z" fill="#dc2626"/><text x="558.3333333333334" y="553" font-size="12.5" font-weight="bold" fill="#dc2626" text-anchor="middle">R1</text><text x="558.3333333333334" y="568" font-size="11" font-weight="normal" fill="#dc2626" text-anchor="middle">29/01</text><polyline points="830.5555555555557,74 830.5555555555557,523" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M830.5555555555557,521 l8,8 l-8,8 l-8,-8 z" fill="#dc2626"/><text x="830.5555555555557" y="553" font-size="12.5" font-weight="bold" fill="#dc2626" text-anchor="middle">R2</text><text x="830.5555555555557" y="568" font-size="11" font-weight="normal" fill="#dc2626" text-anchor="middle">19/03</text><polyline points="1102.7777777777778,74 1102.7777777777778,523" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M1102.7777777777778,521 l8,8 l-8,8 l-8,-8 z" fill="#dc2626"/><text x="1102.7777777777778" y="553" font-size="12.5" font-weight="bold" fill="#dc2626" text-anchor="middle">R3</text><text x="1102.7777777777778" y="568" font-size="11" font-weight="normal" fill="#dc2626" text-anchor="middle">07/05</text><polyline points="1141.6666666666667,74 1141.6666666666667,523" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M1141.6666666666667,521 l8,8 l-8,8 l-8,-8 z" fill="#dc2626"/><text x="1141.6666666666667" y="553" font-size="12.5" font-weight="bold" fill="#dc2626" text-anchor="middle">Remise</text><text x="1141.6666666666667" y="568" font-size="11" font-weight="normal" fill="#dc2626" text-anchor="middle">14/05</text><rect x="30" y="592" width="16" height="12" rx="2" fill="#7c3aed"/><text x="52" y="603" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Gérer un projet (C03)</text><rect x="250" y="592" width="16" height="12" rx="2" fill="#1d4ed8"/><text x="272" y="603" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Coder (C08)</text><rect x="470" y="592" width="16" height="12" rx="2" fill="#059669"/><text x="492" y="603" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Exploiter le réseau (C10)</text><rect x="690" y="592" width="16" height="12" rx="2" fill="#d97706"/><text x="712" y="603" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Physique</text><rect x="910" y="592" width="16" height="12" rx="2" fill="#db2777"/><text x="932" y="603" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Communiquer (C01)</text></svg>