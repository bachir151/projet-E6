" text-anchor="start">1. Besoin, cahier des charges, planning (12 h)</text><rect x="446.0" y="129" width="101.33333333333337" height="16" rx="3" fill="#7c3aed" opacity="0.85"/><rect x="20" y="153" width="1130" height="24" fill="#f9fafb"/><text x="28" y="170" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">V1 – voir la panne, trouver la cause, ouvrir le ticket</text><text x="38" y="198" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">2. Maquette : GLPI, CUPS, VM Windows 11, imprimante (12 h)</text><rect x="483.3333333333333" y="185" width="101.33333333333331" height="16" rx="3" fill="#059669" opacity="0.85"/><text x="38" y="226" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">3. Boîtier : vibration, feuilles, bouton, écran (27 h)</text><rect x="520.6666666666666" y="213" width="250.66666666666663" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><text x="38" y="254" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">4. Physique : vibration, feuilles, humidité (12 h)</text><rect x="595.3333333333333" y="241" width="213.33333333333337" height="16" rx="3" fill="#d97706" opacity="0.85"/><text x="38" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">5. Serveur : règles, SNMP, vérifications réseau (22 h)</text><rect x="632.6666666666666" y="269" width="213.33333333333337" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><text x="38" y="310" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">7. Réseau : DHCP, DNS, NTP, SNMP, captures (8 h)</text><rect x="632.6666666666666" y="297" width="325.33333333333337" height="16" rx="3" fill="#059669" opacity="0.85"/><text x="38" y="338" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">6. PowerShell : file d’impression (JEA), AD (14 h)</text><rect x="707.3333333333333" y="325" width="176.0" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><text x="38" y="366" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">8. GLPI : tickets à paliers, écran, tableau de bord (16 h)</text><rect x="819.3333333333333" y="353" width="176.0" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><rect x="20" y="377" width="1130" height="24" fill="#f9fafb"/><text x="28" y="394" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">V2 – RFID et PC neufs</text><text x="38" y="422" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">9. RFID : carte, preuve, station des PC neufs (12 h)</text><rect x="936.6666666666666" y="409" width="133.33333333333337" height="16" rx="3" fill="#1d4ed8" opacity="0.85"/><text x="38" y="450" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">10. Campagne d’essai, indicateurs, bilan (7 h)</text><rect x="1043.3333333333333" y="437" width="64.0" height="16" rx="3" fill="#7c3aed" opacity="0.85"/><text x="38" y="478" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">11. Dossier et préparation de l’oral (8 h)</text><rect x="1080.6666666666665" y="465" width="64.0" height="16" rx="3" fill="#db2777" opacity="0.85"/><text x="38" y="506" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Journal de bord, journal IA, réunions (tout le long)</text><rect x="446.0" y="493" width="698.6666666666665" height="16" rx="3" fill="#7c3aed" opacity="0.85"/><polyline points="448.6666666666667,74 448.6666666666667,523" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M448.6666666666667,521 l8,8 l-8,8 l-8,-8 z" fill="#dc2626"/><text x="448.6666666666667" y="553" font-size="12.5" font-weight="bold" fill="#dc2626" text-anchor="middle">Début</text><text x="448.6666666666667" y="568" font-size="11" font-weight="normal" fill="#dc2626" text-anchor="middle">04/01</text><polyline points="581.9999999999999,74 581.9999999999999,523" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M581.9999999999999,521 l8,8 l-8,8 l-8,-8 z" fill="#dc2626"/><text x="581.9999999999999" y="553" font-size="12.5" font-weight="bold" fill="#dc2626" text-anchor="middle">R1</text><text x="581.9999999999999" y="568" font-size="11" font-weight="normal" fill="#dc2626" text-anchor="middle">29/01</text><polyline points="843.3333333333333,74 843.3333333333333,523" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M843.3333333333333,521 l8,8 l-8,8 l-8,-8 z" fill="#dc2626"/><text x="843.3333333333333" y="553" font-size="12.5" font-weight="bold" fill="#dc2626" text-anchor="middle">R2</text><text x="843.3333333333333" y="568" font-size="11" font-weight="normal" fill="#dc2626" text-anchor="middle">19/03</text><polyline points="1104.6666666666667,74 1104.6666666666667,523" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M1104.6666666666667,521 l8,8 l-8,8 l-8,-8 z" fill="#dc2626"/><text x="1104.6666666666667" y="553" font-size="12.5" font-weight="bold" fill="#dc2626" text-anchor="middle">R3</text><text x="1104.6666666666667" y="568" font-size="11" font-weight="normal" fill="#dc2626" text-anchor="middle">07/05</text><polyline points="1142.0,74 1142.0,523" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M1142.0,521 l8,8 l-8,8 l-8,-8 z" fill="#dc2626"/><text x="1142.0" y="553" font-size="12.5" font-weight="bold" fill="#dc2626" text-anchor="middle">Remise</text><text x="1142.0" y="568" font-size="11" font-weight="normal" fill="#dc2626" text-anchor="middle">14/05</text><rect x="30" y="592" width="16" height="12" rx="2" fill="#7c3aed"/><text x="52" y="603" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Gérer un projet (C03)</text><rect x="250" y="592" width="16" height="12" rx="2" fill="#1d4ed8"/><text x="272" y="603" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Coder (C08)</text><rect x="470" y="592" width="16" height="12" rx="2"