<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="575" viewBox="0 0 1125 575" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="30" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Diagramme d’exigences (req) – chaque exigence a un indicateur mesuré sur la maquette</text><rect x="330" y="48" width="460" height="92" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/><text x="560.0" y="65" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="560.0" y="85" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">E0 – Le service informatique augmenté</text><text x="560.0" y="108" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Voir la panne d’imprimante, trouver la cause, ouvrir</text><text x="560.0" y="126" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">le ticket avec la preuve ; préparer les PC neufs (V2)</text><circle cx="560.0" cy="154" r="8" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><polyline points="552.0,154 568.0,154" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="560.0,146 560.0,162" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="560.0,162 560.0,180" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="157.5,180 967.5,180" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="30" y="205" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="157.5" y="221" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="157.5" y="238" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E1 – Bonne cause</text><polyline points="30,247 285,247" fill="none" stroke="#4b5563" stroke-width="1"/><text x="38" y="265" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">10 pannes provoquées :</text><text x="38" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">cause juste dans</text><text x="38" y="299" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">au moins 9 cas</text><text x="38" y="335" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : campagne d’essai</text><polyline points="157.5,180 157.5,205" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="300" y="205" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="427.5" y="221" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="427.5" y="238" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E2 – Pas de fausse alerte</text><polyline points="300,247 555,247" fill="none" stroke="#4b5563" stroke-width="1"/><text x="308" y="265" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">1 h d’impressions</text><text x="308" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">normales :</text><text x="308" y="299" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">aucun ticket</text><text x="308" y="335" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : essai d’1 h</text><polyline points="427.5,180 427.5,205" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="570" y="205" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="697.5" y="221" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="697.5" y="238" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E3 – Rapide</text><polyline points="570,247 825,247" fill="none" stroke="#4b5563" stroke-width="1"/><text x="578" y="265" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Moins d’1 minute entre</text><text x="578" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">l’impression ratée</text><text x="578" y="299" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">et le ticket</text><text x="578" y="335" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : chronométrage</text><polyline points="697.5,180 697.5,205" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="840" y="205" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="967.5" y="221" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="967.5" y="238" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E4 – Pages comptées</text><polyline points="840,247 1095,247" fill="none" stroke="#4b5563" stroke-width="1"/><text x="848" y="265" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">compteur SNMP : au plus</text><text x="848" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">1 écart sur 100 pages ;</text><text x="848" y="299" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">10 pages de test sur 10</text><text x="848" y="335" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : comptage</text><polyline points="967.5,180 967.5,205" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="30" y="395" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="157.5" y="411" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="157.5" y="428" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E5 – Diagnostic borné</text><polyline points="30,437 285,437" fill="none" stroke="#4b5563" stroke-width="1"/><text x="38" y="455" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">JEA : commande hors liste</text><text x="38" y="472" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">refusée et tracée ;</text><text x="38" y="489" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">lecture seule du PC</text><text x="38" y="525" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : démonstration</text><polyline points="157.5,370 157.5,395" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="300" y="395" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="427.5" y="411" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="427.5" y="428" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E6 – Retour au terrain</text><polyline points="300,437 555,437" fill="none" stroke="#4b5563" stroke-width="1"/><text x="308" y="455" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Écran du boîtier à jour</text><text x="308" y="472" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">en moins d’1 minute ;</text><text x="308" y="489" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">témoins dans le ticket</text><text x="308" y="525" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : chronométrage</text><polyline points="427.5,370 427.5,395" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="570" y="395" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="697.5" y="411" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="697.5" y="428" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E7 – Bon réseau</text><polyline points="570,437 825,437" fill="none" stroke="#4b5563" stroke-width="1"/><text x="578" y="455" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Imprimante hors du réseau</text><text x="578" y="472" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">attendu par l’AD :</text><text x="578" y="489" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">signalée 5 fois sur 5</text><text x="578" y="525" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : essai, capture</text><polyline points="697.5,370 697.5,395" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="840" y="395" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="967.5" y="411" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="967.5" y="428" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E8 – PC neufs (V2)</text><polyline points="840,437 1095,437" fill="none" stroke="#4b5563" stroke-width="1"/><text x="848" y="455" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">5 PC préparés : bon service</text><text x="848" y="472" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">dans l’AD, applications,</text><text x="848" y="489" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">fiche GLPI à jour</text><text x="848" y="525" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : essai de la station</text><polyline points="967.5,370 967.5,395" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="157.5,370 967.5,370" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="967.5,180 1107,180 1107,370 967.5,370" fill="none" stroke="#6b7280" stroke-width="1.5"/><text x="30" y="562" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">Le symbole ⊕ indique que E0 se décompose en E1 à E8. V1 : E1 à E7 (paliers 1 et 2). V2 : E8, carte de Wassim, preuve de réparation, encre, humidité, palier 3.</text></svg>