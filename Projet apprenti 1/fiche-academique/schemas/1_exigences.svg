<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="575" viewBox="0 0 1125 575" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="30" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Diagramme d’exigences (req) – chaque exigence a un indicateur mesuré sur la maquette</text><rect x="330" y="48" width="460" height="92" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/><text x="560.0" y="65" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="560.0" y="85" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">E0 – Témoin du chariot de soins</text><text x="560.0" y="108" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Voir la panne au moment où elle arrive</text><text x="560.0" y="126" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">et ouvrir le ticket avec la preuve</text><circle cx="560.0" cy="154" r="8" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><polyline points="552.0,154 568.0,154" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="560.0,146 560.0,162" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="560.0,162 560.0,180" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="157.5,180 967.5,180" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="30" y="205" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="157.5" y="221" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="157.5" y="238" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E1 – Voir les pannes</text><polyline points="30,247 285,247" fill="none" stroke="#4b5563" stroke-width="1"/><text x="38" y="265" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Au moins 19 pannes</text><text x="38" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">provoquées sur 20 détectées</text><text x="38" y="299" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">et bien classées</text><text x="38" y="335" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : campagne d’essai</text><polyline points="157.5,180 157.5,205" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="300" y="205" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="427.5" y="221" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="427.5" y="238" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E2 – Pas de fausse alerte</text><polyline points="300,247 555,247" fill="none" stroke="#4b5563" stroke-width="1"/><text x="308" y="265" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Chariot roulé 1 h, seuils</text><text x="308" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">et chocs ordinaires compris :</text><text x="308" y="299" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">0 ticket proposé</text><text x="308" y="335" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : essai de roulage</text><polyline points="427.5,180 427.5,205" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="570" y="205" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="697.5" y="221" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="697.5" y="238" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E3 – Rapide</text><polyline points="570,247 825,247" fill="none" stroke="#4b5563" stroke-width="1"/><text x="578" y="265" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Moins d’1 minute entre</text><text x="578" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">la coupure du 5 V</text><text x="578" y="299" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">et le ticket</text><text x="578" y="335" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : chronométrage</text><polyline points="697.5,180 697.5,205" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="840" y="205" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="967.5" y="221" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="967.5" y="238" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E4 – Tenir</text><polyline points="840,247 1095,247" fill="none" stroke="#4b5563" stroke-width="1"/><text x="848" y="265" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">72 h sans perte ; Wi-Fi</text><text x="848" y="282" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">coupé : mesures gardées</text><text x="848" y="299" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">puis renvoyées</text><text x="848" y="335" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : essai 72 h, capture</text><polyline points="967.5,180 967.5,205" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="30" y="395" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="157.5" y="411" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="157.5" y="428" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E5 – Diagnostic borné</text><polyline points="30,437 285,437" fill="none" stroke="#4b5563" stroke-width="1"/><text x="38" y="455" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">JEA : commande hors liste</text><text x="38" y="472" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">refusée et tracée ;</text><text x="38" y="489" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">lecture seule du PC</text><text x="38" y="525" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : démonstration</text><polyline points="157.5,370 157.5,395" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="300" y="395" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="427.5" y="411" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="427.5" y="428" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E6 – Ticket utile</text><polyline points="300,437 555,437" fill="none" stroke="#4b5563" stroke-width="1"/><text x="308" y="455" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Frise, cause probable et</text><text x="308" y="472" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">diagnostic dans le ticket ;</text><text x="308" y="489" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">paliers, 1 ticket par jour</text><text x="308" y="525" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : avis du technicien</text><polyline points="427.5,370 427.5,395" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="570" y="395" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="697.5" y="411" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="697.5" y="428" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E7 – Horloges alignées</text><polyline points="570,437 825,437" fill="none" stroke="#4b5563" stroke-width="1"/><text x="578" y="455" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Écart NTP entre boîtier,</text><text x="578" y="472" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">serveur et PC mesuré</text><text x="578" y="489" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">et affiché dans le rapport</text><text x="578" y="525" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : mesure, capture</text><polyline points="697.5,370 697.5,395" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="840" y="395" width="255" height="140" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="967.5" y="411" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«requirement»</text><text x="967.5" y="428" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">E8 – Bilan chiffré</text><polyline points="840,437 1095,437" fill="none" stroke="#4b5563" stroke-width="1"/><text x="848" y="455" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">« Je recommande » ou non :</text><text x="848" y="472" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">coût des boîtiers contre</text><text x="848" y="489" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">déplacements évités (V2)</text><text x="848" y="525" font-size="11.5" font-weight="normal" fill="#1d4ed8" text-anchor="start">Vérifié par : bilan écrit</text><polyline points="967.5,370 967.5,395" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="157.5,370 967.5,370" fill="none" stroke="#6b7280" stroke-width="1.5"/><polyline points="967.5,180 1107,180 1107,370 967.5,370" fill="none" stroke="#6b7280" stroke-width="1.5"/><text x="30" y="562" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">Le symbole ⊕ indique que E0 se décompose en E1 à E8. V1 : E1 à E7 (paliers 1 et 2). V2 : E8, palier 3, température et frise Grafana.</text></svg>