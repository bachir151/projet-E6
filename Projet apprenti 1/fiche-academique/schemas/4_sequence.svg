<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="875" viewBox="0 0 1160 875" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="30" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Diagramme de séquence (sd) – l’imprimante est figée : elle dit « tout va bien » mais rien ne sort</text><circle cx="70" cy="52" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="70,62 70,90" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="54,72 86,72" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="57,112 70,90 83,112" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="70" y="132" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle"></text><text x="70" y="142" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Secrétaire</text><polyline points="70,152 70,830" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="147" y="60" width="136" height="40" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="215" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:PC secrétaire</text><polyline points="215,100 215,830" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="342" y="60" width="136" height="40" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.4"/><text x="410" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Serveur</text><polyline points="410,100 410,830" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="532" y="60" width="136" height="40" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="600" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Imprimante</text><polyline points="600,100 600,830" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="702" y="60" width="136" height="40" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.4"/><text x="770" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Boîtier</text><polyline points="770,100 770,830" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="862" y="60" width="136" height="40" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="930" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:GLPI</text><polyline points="930,100 930,830" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="1085" cy="52" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="1085,62 1085,90" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="1069,72 1101,72" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="1072,112 1085,90 1098,112" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="1085" y="132" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle"></text><text x="1085" y="142" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Technicien</text><polyline points="1085,152 1085,830" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><text x="30" y="170" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">9:10:00 – la secrétaire imprime un compte rendu</text><line x1="70" y1="200" x2="209" y2="200" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="139.5" y="194" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">1. imprimer (5 p.)</text><line x1="215" y1="235" x2="404" y2="235" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="309.5" y="229" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">2. travail d’impression (IPP)</text><line x1="410" y1="270" x2="594" y2="270" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="502.0" y="264" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">3. les 5 pages</text><text x="30" y="310" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">9:10:30 – rien ne sort</text><line x1="770" y1="335" x2="416" y2="335" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="593.0" y="329" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">4. vibration : non ; feuilles : 0 (MQTT)</text><line x1="410" y1="370" x2="594" y2="370" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="502.0" y="364" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">5. état ? (SNMP)</text><line x1="600" y1="405" x2="416" y2="405" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="508.0" y="399" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">6. « prête, aucune erreur »</text><line x1="410" y1="440" x2="221" y2="440" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="315.5" y="434" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">7. file ? (JEA)</text><line x1="215" y1="475" x2="404" y2="475" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="309.5" y="469" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">8. 0 document</text><polyline points="410,495 450,495 450,517 416,517" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="430" y1="517" x2="414" y2="517" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="458" y="503" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">9. envoyé, rien ne bouge, elle dit « ça va »</text><text x="458" y="519" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">→ imprimante figée</text><line x1="410" y1="560" x2="924" y2="560" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="667.0" y="554" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">10. ticket + « redémarrer ? » (palier 2)</text><line x1="410" y1="595" x2="764" y2="595" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="690" y="589" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">11. écran « Bloquée »</text><text x="30" y="635" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">9:11:10</text><line x1="1085" y1="655" x2="416" y2="655" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="840" y="649" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">12. valide le redémarrage</text><line x1="410" y1="690" x2="594" y2="690" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="502.0" y="684" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">13. redémarrage</text><text x="30" y="730" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">9:14:00</text><line x1="770" y1="750" x2="416" y2="750" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="593.0" y="744" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">14. vibration ; 5 feuilles comptées</text><line x1="410" y1="785" x2="924" y2="785" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="667.0" y="779" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">15. résolu, preuve jointe</text><line x1="410" y1="820" x2="764" y2="820" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="690" y="814" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">16. écran « Réparé »</text><text x="30" y="860" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">Palier 1 : le système conseille seulement. Palier 3 (V2) : il redémarre seul, la nuit, et le note dans le ticket.</text></svg>