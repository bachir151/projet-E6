<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="805" viewBox="0 0 1160 805" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="30" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Diagramme de séquence (sd) – le chariot passe le seuil de l’ascenseur, le PC s’éteint, le ticket s’ouvre</text><rect x="55" y="60" width="150" height="40" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.4"/><text x="130" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Boîtier</text><polyline points="130,100 130,760" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="315" y="60" width="150" height="40" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="1.4"/><text x="390" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:Serveur</text><polyline points="390,100 390,760" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="585" y="60" width="150" height="40" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="660" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:PC du chariot</text><polyline points="660,100 660,760" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="815" y="60" width="150" height="40" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="890" y="86" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">:GLPI</text><polyline points="890,100 890,760" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="1070" cy="52" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="1070,62 1070,90" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="1054,72 1086,72" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="1057,112 1070,90 1083,112" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="1070" y="132" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle"></text><text x="1070" y="142" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Technicien</text><polyline points="1070,152 1070,760" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><text x="30" y="170" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">10:42:07 – le chariot passe le seuil de l’ascenseur</text><polyline points="130,182 170,182 170,204 136,204" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="150" y1="204" x2="134" y2="204" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="178" y="190" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">1. secousse 2,1 g (interruption)</text><line x1="130" y1="235" x2="384" y2="235" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="257.0" y="229" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">2. « secousse » (MQTT/TLS)</text><text x="30" y="275" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">10:42:09 – le PC s’éteint</text><polyline points="130,287 170,287 170,309 136,309" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="150" y1="309" x2="134" y2="309" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="178" y="295" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">3. 5 V → 0 V ; le boîtier</text><text x="178" y="311" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">continue sur sa batterie</text><line x1="130" y1="345" x2="384" y2="345" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="257.0" y="339" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">4. « coupure » + n° de séquence</text><polyline points="390,357 430,357 430,379 396,379" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="410" y1="379" x2="394" y2="379" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="438" y="365" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">5. règle : secousse 2 s avant la coupure,</text><text x="438" y="381" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">batterie chargée → faux contact probable</text><text x="30" y="425" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">10:42:40</text><line x1="390" y1="430" x2="884" y2="430" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="637.0" y="424" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">6. proposer le ticket (palier 2) – API REST HTTPS</text><line x1="1070" y1="470" x2="896" y2="470" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="983.0" y="464" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">7. valide d’un clic</text><text x="30" y="515" font-size="12.5" font-weight="#1d4ed8" fill="#1f2937" text-anchor="start" font-style="italic">10:43:20 – le PC est rallumé</text><line x1="390" y1="535" x2="654" y2="535" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="522.0" y="529" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">8. diagnostic (WinRM HTTPS, JEA)</text><polyline points="660,547 700,547 700,569 666,569" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="680" y1="569" x2="664" y2="569" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="708" y="555" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">9. Get-WinEvent, batterie,</text><text x="708" y="571" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">powercfg, disque (lecture seule)</text><line x1="660" y1="610" x2="396" y2="610" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="528.0" y="604" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">10. Kernel-Power 41, batterie 65 %</text><line x1="390" y1="655" x2="884" y2="655" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="637.0" y="649" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">11. suivi : frise + rapport joints au ticket</text><line x1="890" y1="700" x2="1064" y2="700" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flo)"/><text x="977.0" y="694" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="middle">12. lit le ticket</text><polyline points="1070,715 1110,715 1110,737 1076,737" fill="none" stroke="#6b7280" stroke-width="1.5"/><line x1="1090" y1="737" x2="1074" y2="737" stroke="#6b7280" stroke-width="1.5" marker-end="url(#fl)"/><text x="1118" y="723" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start"></text><text x="1058" y="736" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="end">13. refixe le connecteur,</text><text x="1058" y="752" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="end">ferme le ticket lui-même</text><text x="30" y="790" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">Palier 1 : le système note seulement « j’aurais ouvert un ticket ». Palier 3 (V2) : il l’ouvre seul. Les pannes suivantes du jour s’ajoutent au même ticket.</text></svg>