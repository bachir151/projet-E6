<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="685" viewBox="0 0 1140 685" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="flo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="30" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Diagramme de contexte – le système et ce qui l’entoure</text><rect x="390" y="220" width="340" height="150" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/><text x="560.0" y="242" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«system»</text><text x="560.0" y="266" font-size="14.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Le service informatique augmenté</text><text x="560.0" y="298" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">boîtier collé sur l’imprimante</text><text x="560.0" y="318" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">+ serveur (règles, tickets, tableau de bord)</text><text x="560.0" y="338" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">+ station des PC neufs (V2)</text><circle cx="120" cy="60" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="120,70 120,98" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="104,80 136,80" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="107,120 120,98 133,120" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="120" y="140" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Secrétaire</text><text x="120" y="156" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">imprime, appuie sur le bouton</text><line x1="175" y1="120" x2="388" y2="250" stroke="#6b7280" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="290" y="232" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="end">bouton, écran</text><circle cx="120" cy="400" r="10" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><polyline points="120,410 120,438" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="104,420 136,420" fill="none" stroke="#1f2937" stroke-width="1.6"/><polyline points="107,460 120,438 133,460" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="120" y="480" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Technicien support</text><text x="120" y="496" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">lit, décide, pose sa carte</text><line x1="165" y1="450" x2="388" y2="340" stroke="#6b7280" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="290" y="440" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">ticket, conseil</text><text x="290" y="456" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">(palier 1), cartes (V2)</text><rect x="430" y="60" width="260" height="64" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="560.0" y="80" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«external»</text><text x="560.0" y="97" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Imprimante réseau</text><text x="560.0" y="119" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">vibre, imprime, compte ses pages</text><line x1="560" y1="126" x2="560" y2="218" stroke="#6b7280" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="570" y="180" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">vibration, état, compteur</text><text x="570" y="196" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">(SNMP)</text><rect x="880" y="60" width="230" height="64" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="995.0" y="80" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«external»</text><text x="995.0" y="97" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">PC de la secrétaire</text><text x="995.0" y="119" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Windows 11, file d’impression</text><line x1="880" y1="110" x2="732" y2="250" stroke="#6b7280" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="842" y="212" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">file d’impression</text><text x="842" y="228" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">(lecture seule, JEA)</text><rect x="880" y="270" width="230" height="64" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="995.0" y="290" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«external»</text><text x="995.0" y="307" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">GLPI</text><text x="995.0" y="329" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">tickets, fiches des PC</text><line x1="878" y1="300" x2="732" y2="300" stroke="#6b7280" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="805.0" y="292" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">tickets, suivis</text><rect x="880" y="470" width="230" height="64" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4"/><text x="995.0" y="490" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«external»</text><text x="995.0" y="507" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Annuaire AD (Samba) · V2</text><text x="995.0" y="529" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">service de chaque PC</text><line x1="878" y1="500" x2="732" y2="355" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fl)"/><text x="822" y="418" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">service, réseau attendu</text><rect x="430" y="470" width="260" height="64" rx="8" fill="#fff" stroke="#4b5563" stroke-width="1.4"/><text x="560.0" y="490" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«external»</text><text x="560.0" y="507" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Réseau de la maquette</text><text x="560.0" y="529" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Wi-Fi, DHCP, DNS, NTP</text><line x1="560" y1="468" x2="560" y2="372" stroke="#6b7280" stroke-width="1.5" marker-start="url(#fl)" marker-end="url(#fl)"/><text x="570" y="430" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">adresses, heure commune</text><rect x="60" y="560" width="250" height="64" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4"/><text x="185.0" y="580" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">«external»</text><text x="185.0" y="597" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">PC neuf (V2)</text><text x="185.0" y="619" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Windows 11 Entreprise</text><line x1="312" y1="590" x2="430" y2="372" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fl)"/><text x="330" y="610" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">préparation (V2)</text><text x="30" y="670" font-size="12.5" font-weight="normal" fill="#6b7280" text-anchor="start">Hors périmètre : dossier patient informatisé, 